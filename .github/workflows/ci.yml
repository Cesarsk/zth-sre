name: SRE Lab CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Verify catalog
        run: make verify-catalog
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Run Go tests and Prometheus validation
        run: make test
      - name: Start and simulate exercise contracts
        run: make verify-exercises
      - name: Run browser smoke tests
        run: make smoke
